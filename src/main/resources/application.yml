# testVue 서버 설정. DB 접속 정보는 db/00-init.sql 이 만든 계정이다(시험용).
server:
  port: ${APP_PORT:7100}
  servlet:
    session:
      timeout: 60m

spring:
  application:
    name: testVue
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/testVue?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: tvueapp
    password: Tvueapp1234!

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

logging:
  file:
    name: logs/testVue.log
  level:
    com.testvue: DEBUG
